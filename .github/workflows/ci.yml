# .github/workflows/ci.yml
# Place at: ApplyFlow/.github/workflows/ci.yml  (repo ROOT — not inside Frontend/)
#
# Create the folder first:
#   mkdir -p .github/workflows
#   cp this file → .github/workflows/ci.yml
#
# GitHub secret needed (add once):
#   Name:  RENDER_DEPLOY_HOOK_URL
#   Value: Render dashboard → applyflow-api → Settings → Deploy Hook → Copy URL
#   Add:   GitHub repo → Settings → Secrets and variables → Actions → New repository secret

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint + basic import check ──────────────────────────────────────────────
  test:
    name: Lint & Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          cd Backend
          # Ruff checks for syntax errors, unused imports, undefined names
          # Adjust rules to match your code style
          ruff check app/ --select=E,F,W --ignore=E501
        # E501 = line too long — ignored since your code has some long lines
        # E = pycodestyle errors, F = pyflakes (undefined/unused), W = warnings

      - name: Check app imports correctly
        run: |
          cd Backend
          # Verifies all imports resolve — catches missing packages early
          # Uses SQLite so no Neon credentials needed in CI
          python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///./test.db'
          os.environ['SECRET_KEY']   = 'ci-test-secret-minimum-32-characters-ok'
          os.environ['ACCESS_TOKEN_EXPIRE_MINUTES'] = '30'
          os.environ['ENVIRONMENT']  = 'test'
          # This triggers Base.metadata.create_all — if it runs, imports are fine
          from app.main import app
          print('✅ App imports OK')
          "
        working-directory: Backend

  # ── Deploy to Render ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          echo "Render responded with HTTP $STATUS"

          if [[ "$STATUS" != "200" && "$STATUS" != "201" ]]; then
            echo "❌ Deploy hook failed — check RENDER_DEPLOY_HOOK_URL secret"
            exit 1
          fi

          echo "✅ Deploy triggered successfully"
          echo "🔗 Docs: https://applyflow-api.onrender.com/docs"